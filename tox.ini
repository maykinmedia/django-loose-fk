[tox]
envlist =
    py{311,312,313}-django{52}
    ruff
    docs
    type-checking
skip_missing_interpreters = true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
DJANGO =
    5.2: django52

[testenv]
setenv = DJANGO_SETTINGS_MODULE=testapp.settings
extras =
    openapi
    tests
    coverage
deps =
  django52: Django~=5.2.0
  structlog
passenv =
    PGUSER
    PGDATABASE
    PGPASSWORD
    PGPORT
    PGHOST
setenv   =
    PYTHONPATH = {toxinidir}
commands =
  pytest tests \
   --junitxml=reports/junit.xml \
   --cov --cov-report xml:reports/coverage-{envname}.xml \
   {posargs}

[testenv:ruff]
extras = tests
skipsdist = True
commands =
    ruff check --output-format=github .
    ruff format --check

[testenv:docs]
basepython=python
changedir=docs
skipsdist=true
extras =
    docs
allowlist_externals = make
commands=
    make SPHINXOPTS="-W" html
    make linkcheck

[testenv:type-checking]
description = Run static type checking with Pyright
deps = .[type-checking,tests]
skipsdist = True
commands = pyright --project pyright.pyproject.toml
